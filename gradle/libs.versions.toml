[versions]
agp                     = "8.5.2"
kotlin                  = "2.0.0"
ksp                     = "2.0.0-1.0.22"
hilt                    = "2.51.1"
compose-bom             = "2024.06.00"
compose-tv              = "1.0.0-beta01"
lifecycle               = "2.8.3"
navigation              = "2.8.0-beta06"
retrofit                = "2.11.0"
okhttp                  = "4.12.0"
moshi                   = "1.15.1"
coil                    = "2.7.0"
room                    = "2.6.1"
exoplayer               = "1.4.0"
coroutines              = "1.8.1"
libtorrent4j            = "2.1.0-29"
security-crypto         = "1.1.0-alpha06"
datastore               = "1.1.1"
junit                   = "4.13.2"
mockk                   = "1.13.11"
turbine                 = "1.1.0"
core-ktx                = "1.13.1"
appcompat               = "1.7.0"
nanohttpd               = "2.3.1"

[libraries]
# AndroidX Core
androidx-core-ktx           = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-appcompat          = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel= { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# Compose
compose-bom                 = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui                  = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling          = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-tv-foundation       = { group = "androidx.tv", name = "tv-foundation", version.ref = "compose-tv" }
compose-tv-material         = { group = "androidx.tv", name = "tv-material", version.ref = "compose-tv" }

# Navigation
navigation-compose          = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
hilt-navigation-compose     = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }

# Hilt
hilt-android                = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

# Networking
retrofit-core               = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-moshi              = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
okhttp-core                 = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging              = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
moshi-core                  = { group = "com.squareup.moshi", name = "moshi", version.ref = "moshi" }
moshi-kotlin                = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
moshi-codegen               = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }

# Room
room-runtime                = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                    = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler               = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ExoPlayer
exoplayer-core              = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "exoplayer" }
exoplayer-ui                = { group = "androidx.media3", name = "media3-ui", version.ref = "exoplayer" }
exoplayer-hls               = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "exoplayer" }
exoplayer-dash              = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "exoplayer" }

# Coil
coil-compose                = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Coroutines
coroutines-core             = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android          = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Libtorrent4j & Streaming
libtorrent4j-android-arm64  = { group = "org.libtorrent4j", name = "libtorrent4j-android-arm64", version.ref = "libtorrent4j" }
libtorrent4j-android-arm    = { group = "org.libtorrent4j", name = "libtorrent4j-android-arm", version.ref = "libtorrent4j" }
nanohttpd-core              = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }

# Security
security-crypto             = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }
datastore-prefs             = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Testing
junit                       = { group = "junit", name = "junit", version.ref = "junit" }
mockk                       = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
coroutines-test             = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
turbine                     = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[plugins]
android-application         = { id = "com.android.application", version.ref = "agp" }
android-library             = { id = "com.android.library", version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                         = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                        = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

[bundles]
compose                     = ["compose-ui", "compose-material3", "compose-tv-foundation", "compose-tv-material"]
networking                  = ["retrofit-core", "retrofit-moshi", "okhttp-core", "okhttp-logging", "moshi-core", "moshi-kotlin"]
exoplayer                   = ["exoplayer-core", "exoplayer-ui", "exoplayer-hls", "exoplayer-dash"]
coroutines                  = ["coroutines-core", "coroutines-android"]
room                        = ["room-runtime", "room-ktx"]
testing                     = ["junit", "mockk", "coroutines-test", "turbine"]


name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'SECURITY.md'
      - 'AppIcons/**'
      - '**.png'
      - '**.jpg'
      - '**.svg'
      - '.gitignore'
      - 'local.properties.example'
      - 'LICENSE'
      - 'docs/**'
      - '.vscode/**'
      - '.idea/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/changelog-check.yml'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (e.g. 1.0.1) — leave empty for auto-detection from CHANGELOG.md'
        required: false
        type: string
        default: ''
      version_code:
        description: 'Monotonically increasing versionCode for Android (optional)'
        required: false
        type: string
      prerelease:
        description: 'Mark this release as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Determine Version & Check Release Status
      id: versioning
      run: |
        git fetch --tags origin || true

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          RAW_VERSION="${{ inputs.version }}"
          INPUT_CODE="${{ inputs.version_code }}"
        elif [ "${{ github.ref_type }}" = "tag" ]; then
          RAW_VERSION="${GITHUB_REF_NAME}"
          INPUT_CODE=""
        else
          RAW_VERSION=""
          INPUT_CODE=""
        fi

        if [ -z "$RAW_VERSION" ]; then
          echo "No explicit version provided. Extracting latest version from CHANGELOG.md..."
          VERSION=$(python3 scripts/changelog.py latest)
          echo "Detected version from CHANGELOG.md: $VERSION"

          # Check if this tag already exists on remote
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Release tag v$VERSION is already published! Skipping release build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        else
          # Strip leading 'v'
          VERSION="${RAW_VERSION#v}"
        fi

        echo "skip=false" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV

        if [ -n "$INPUT_CODE" ]; then
          CODE="$INPUT_CODE"
        else
          CODE=$(git rev-list --count HEAD)
        fi
        echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
        echo "VERSION_CODE=$CODE" >> $GITHUB_ENV

        echo "Target Release Version: $VERSION"
        echo "Target Release VersionCode: $CODE"

    - name: Validate CHANGELOG.md Entry
      if: steps.versioning.outputs.skip != 'true'
      run: |
        python3 scripts/changelog.py validate "$VERSION"

    - name: Extract Release Notes from CHANGELOG.md
      if: steps.versioning.outputs.skip != 'true'
      run: |
        python3 scripts/changelog.py extract "$VERSION" > RELEASE_NOTES.md
        echo "--- Release Notes Preview ---"
        cat RELEASE_NOTES.md

    - name: Set up JDK 17
      if: steps.versioning.outputs.skip != 'true'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      if: steps.versioning.outputs.skip != 'true'
      uses: gradle/actions/setup-gradle@v3

    - name: Make Gradlew Executable
      if: steps.versioning.outputs.skip != 'true'
      run: chmod +x gradlew

    - name: Setup Release Keystore
      if: steps.versioning.outputs.skip != 'true'
      id: keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "Custom release keystore configured from repository secrets."
        else
          echo "No custom keystore provided in secrets; generating self-signed release keystore..."
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias northlight \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=NorthLight, OU=AndroidTV, O=NorthLight, C=US"
          echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_ALIAS=northlight" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          echo "Generated self-signed release keystore."
        fi

    - name: Build Release APK
      if: steps.versioning.outputs.skip != 'true'
      env:
        VERSION_NAME: ${{ env.VERSION }}
        VERSION_CODE: ${{ env.VERSION_CODE }}
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      run: |
        ./gradlew assembleRelease \
          -PversionName="$VERSION" \
          -PversionCode="$VERSION_CODE" \
          -PTMDB_API_KEY="${TMDB_API_KEY:-}" \
          --stacktrace

    - name: Prepare Release Asset
      if: steps.versioning.outputs.skip != 'true'
      run: |
        mkdir -p dist
        APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        if [ -z "$APK_FILE" ]; then
          echo "Error: Release APK not found!"
          exit 1
        fi
        TARGET_APK="dist/NorthLight-v${VERSION}.apk"
        cp "$APK_FILE" "$TARGET_APK"
        echo "Packaged asset: $TARGET_APK"

    - name: Create GitHub Release
      if: steps.versioning.outputs.skip != 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: NorthLight v${{ env.VERSION }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: ${{ inputs.prerelease || false }}
        files: |
          dist/NorthLight-v${{ env.VERSION }}.apk

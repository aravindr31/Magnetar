name: Release

on:
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (e.g. 1.0.1) — leave empty for auto-calculation from commits'
        required: false
        type: string
        default: ''
      version_code:
        description: 'Monotonically increasing versionCode for Android (optional)'
        required: false
        type: string
      prerelease:
        description: 'Mark this release as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Determine Version & VersionCode
      id: versioning
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          RAW_VERSION="${{ inputs.version }}"
          INPUT_CODE="${{ inputs.version_code }}"
        elif [ "${{ github.ref_type }}" = "tag" ]; then
          RAW_VERSION="${GITHUB_REF_NAME}"
          INPUT_CODE=""
        else
          RAW_VERSION=""
          INPUT_CODE=""
        fi

        if [ -z "$RAW_VERSION" ]; then
          echo "No explicit version provided. Running automatic calculation from Conventional Commits..."
          AUTO_OUT=$(python3 scripts/changelog.py auto)
          VERSION=$(echo "$AUTO_OUT" | grep "NEXT_VERSION=" | cut -d'=' -f2)
          echo "Auto-detected version: $VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): auto-update changelog for v$VERSION" || true
          git push origin main || true
        else
          # Strip leading 'v'
          VERSION="${RAW_VERSION#v}"
        fi

        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV

        # Calculate or use provided versionCode
        if [ -n "$INPUT_CODE" ]; then
          CODE="$INPUT_CODE"
        else
          # Default to git commit count for monotonic versionCode
          CODE=$(git rev-list --count HEAD)
        fi
        echo "VERSION_CODE=$CODE" >> $GITHUB_ENV

        echo "Target Release Version: $VERSION"
        echo "Target Release VersionCode: $CODE"

    - name: Validate CHANGELOG.md Entry
      run: |
        python3 scripts/changelog.py validate "$VERSION"

    - name: Extract Release Notes from CHANGELOG.md
      run: |
        python3 scripts/changelog.py extract "$VERSION" > RELEASE_NOTES.md
        echo "--- Release Notes Preview ---"
        cat RELEASE_NOTES.md

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Setup Release Keystore (if secret provided)
      id: keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "Custom release keystore configured."
        else
          echo "No custom keystore provided in secrets; falling back to default signing."
        fi

    - name: Build Release APK
      env:
        VERSION_NAME: ${{ env.VERSION }}
        VERSION_CODE: ${{ env.VERSION_CODE }}
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      run: |
        ./gradlew assembleRelease \
          -PversionName="$VERSION" \
          -PversionCode="$VERSION_CODE" \
          -PTMDB_API_KEY="${TMDB_API_KEY:-}" \
          --stacktrace

    - name: Prepare Release Asset
      run: |
        mkdir -p dist
        APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        if [ -z "$APK_FILE" ]; then
          echo "Error: Release APK not found!"
          exit 1
        fi
        TARGET_APK="dist/NorthLight-v${VERSION}.apk"
        cp "$APK_FILE" "$TARGET_APK"
        echo "Packaged asset: $TARGET_APK"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: NorthLight v${{ env.VERSION }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: ${{ inputs.prerelease || false }}
        files: |
          dist/NorthLight-v${{ env.VERSION }}.apk
